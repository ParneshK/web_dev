<!DOCTYPE html>
<html>
<head>
  <title>My Animal Fact File</title>
  <style>

    /* Page background */
    body {
      background-color: #1b4332;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    /* Animal fact file box */
    .fact-file {
      background-color: #f1faee;
      color: darkslategray;
      width: 400px;
      padding: 25px;
      border: 4px solid #74c69d;
      margin: 40px auto;
      border-radius: 15px;
      box-shadow: 5px 5px 15px black;
    }

    /* Animal name */
    .animal-name {
      color: forestgreen;
      font-size: 28px;
      text-align: center;
      background-color: #d8f3dc;
      padding: 12px;
      border-radius: 10px;
    }

    /* Detail rows */
    .detail {
      color: darkslategray;
      font-size: 16px;
      padding: 5px;
    }

    /* Cool fact */
    .cool-fact {
      color: #d97706;
      font-style: italic;
      background-color: #fff3cd;
      padding: 12px;
      border-radius: 8px;
      border-left: 5px solid orange;
    }

  </style>
</head>
<body>

  <div class="fact-file">
    <h2 class="animal-name">Snow Leopard 🐆</h2>

    <p class="detail">Type: Big Cat</p>
    <p class="detail">Lives in: Mountain ranges of Central Asia</p>
    <p class="detail">Diet: Deer, goats, and wild sheep</p>

    <p class="cool-fact">
      Cool Fact: Can leap up to 15 metres in one jump!
    </p>
  </div>

</body>
</html>
